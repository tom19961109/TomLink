name: Android preview release

on:
  push:
    tags: ['v*-alpha.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build preview APK
        run: bash gradlew assembleDebug --console=plain
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          cp app/build/outputs/apk/debug/app-debug.apk TomLink-Android-preview.apk
          sha256sum TomLink-Android-preview.apk > SHA256SUMS.txt
          gh release create "$TAG" --verify-tag --prerelease --title "TomLink $TAG" \
            --notes "Android 8.0+ preview with background counting, optional step detector, and Gmail-authorized TomPet sync. JSON export is available offline. This APK is debug signed. Export your data from an earlier preview before replacing it if Android requires a reinstall." \
            TomLink-Android-preview.apk SHA256SUMS.txt
