name: Android release

on:
  push:
    tags: ['v*-alpha.*', 'v*.*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      CERT_SHA256: 05877b12205ab6824875b5e8ed864dbaa0746a99855fcaa7cce37b3d19f21738
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Verify signed release assets
        shell: bash
        run: |
          set -x
          sdkmanager 'build-tools;36.0.0'
          tools="$ANDROID_HOME/build-tools/36.0.0"
          git fetch --depth=2 origin "refs/tags/apk-$TAG"
          test "$(git rev-parse FETCH_HEAD^)" = "$(git rev-parse HEAD)"
          git show FETCH_HEAD:TomLink-Android-preview.apk > TomLink-Android-preview.apk
          git show FETCH_HEAD:update.json > update.json
          certs="$("$tools/apksigner" verify --print-certs TomLink-Android-preview.apk)"
          test "$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$certs")" = "$CERT_SHA256"
          sha256sum TomLink-Android-preview.apk > SHA256SUMS.txt
          test "$(jq -r .sha256 update.json)" = "$(cut -d ' ' -f 1 SHA256SUMS.txt)"
          version="$(jq -r .versionName update.json)"
          version_code="$(jq -r .versionCode update.json)"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          test "v$version" = "$TAG"
          "$tools/aapt" dump badging TomLink-Android-preview.apk > apk-badging.txt
          grep -F "package: name='com.tomforge.tomlink' versionCode='$version_code' versionName='$version'" apk-badging.txt
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          flags=()
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags+=(--latest)
          elif [[ "$TAG" == *-alpha.* ]]; then
            flags+=(--prerelease)
          else
            exit 1
          fi
          gh release create "$TAG" --verify-tag "${flags[@]}" --title "TomLink $TAG" \
            --generate-notes \
            TomLink-Android-preview.apk update.json SHA256SUMS.txt
