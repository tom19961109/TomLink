name: Android preview release

on:
  push:
    tags:
      - 'v*-alpha.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build preview APK
        run: bash gradlew assembleDebug --console=plain
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TomLink-Android-preview.apk
          sha256sum TomLink-Android-preview.apk > SHA256SUMS.txt
          gh release create "$TAG" --verify-tag --prerelease --title "TomLink $TAG" \
            --notes "Android 8.0+ preview. Foreground step counter with local SQLite storage and JSON export. Requires a device with a step counter. This APK is debug signed. Future versions may require uninstalling this preview, so export your data first." \
            TomLink-Android-preview.apk SHA256SUMS.txt
